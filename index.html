
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .kalkulator {
            width: 330px;
            padding: 22px;
            background: #172033;
            border: 1px solid #334155;
            border-radius: 25px;
            box-shadow: 0 15px 40px #0008;
        }

        .judul {
            color: white;
            text-align: center;
            font-size: 23px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .layar {
            width: 100%;
            height: 75px;
            border: 2px solid #334155;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: right;
            font-size: 27px;
            background: #0f172a;
            color:white;
            outline: none;
        }

        .tombol {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 15px;
            background: #334155;
            color: white;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px #0003;
        }

        button:hover {
            background: #475569;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .hapus {
            background: #ef4444;
        }

        .hapus:hover {
            background: #dc2626;
        }

        .hapus-satu {
            background: #f59e0b;
        }

        .hapus-satu:hover {
            background: #d97706;
        }

        .operator {
            background: #0284c7;
        }

        .operator:hover {
            background: #0369a1;
        }

        .hasil {
            background: #16a34a;
            color: white;
        }

        .hasil:hover {
            background: #15803d;
        }

        .nol {
            grid-column: span 2;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="kalkulator">

        <div class="judul"></div>

        <input type="text" class="layar" id="layar"
               value="0" readonly>

        <div class="tombol">
            <button class="hapus" onclick="bersihkan()">C</button>
            <button class="hapus-satu" onclick="hapusSatu()">⌫</button>
            <button class="operator" onclick="persen()">%</button>
            <button class="operator" onclick="tambahOperator('/')">÷</button>

            <button onclick="masukkan('7')">7</button>
            <button onclick="masukkan('8')">8</button>
            <button onclick="masukkan('9')">9</button>
            <button class="operator" onclick="tambahOperator('*')">×</button>

            <button onclick="masukkan('4')">4</button>
            <button onclick="masukkan('5')">5</button>
            <button onclick="masukkan('6')">6</button>
            <button class="operator" onclick="tambahOperator('-')">−</button>

            <button onclick="masukkan('1')">1</button>
            <button onclick="masukkan('2')">2</button>
            <button onclick="masukkan('3')">3</button>
            <button class="operator" onclick="tambahOperator('+')">+</button>

            <button class="nol" onclick="masukkan('0')">0</button>
            <button onclick="masukkan('.')">.</button>
            <button class="hasil" onclick="hitung()">=</button>
        </div>

        <div class="footer">
        </div>

    </div>

    <script>
        const layar = document.getElementById("layar");
        let ekspresi = "";

        function masukkan(nilai) {
            if (["Error", "Tidak Terhingga",
                 "Tidak Terdefinisi"].includes(ekspresi)) {
                ekspresi = "";
            }

            if (layar.value === "0" && nilai !== ".") {
                ekspresi = nilai;
            } else {
                ekspresi += nilai;
            }

            layar.value = ekspresi;
        }

        function tambahOperator(operator) {
            if (ekspresi !== "" &&
                !["Error", "Tidak Terhingga",
                  "Tidak Terdefinisi"].includes(ekspresi)) {
                ekspresi += operator;
                layar.value = ekspresi;
            }
        }

        function bersihkan() {
            ekspresi = "";
            layar.value = "0";
        }

        function hapusSatu() {
            if (["Error", "Tidak Terhingga",
                 "Tidak Terdefinisi"].includes(ekspresi)) {
                bersihkan();
                return;
            }

            ekspresi = ekspresi.slice(0, -1);
            layar.value = ekspresi || "0";
        }

        function persen() {
            if (ekspresi !== "" && !isNaN(Number(ekspresi))) {
                ekspresi = String(Number(ekspresi) / 100);
                layar.value = ekspresi;
            }
        }

        function hitung() {
            try {
                if (!/^[0-9+\-*/.() ]+$/.test(ekspresi)) {
                    throw new Error("Input tidak valid");
                }

                const hasil = Function(
                    '"use strict"; return (' + ekspresi + ')'
                )();

                if (Number.isNaN(hasil)) {
                    layar.value = "Tidak Terdefinisi";
                } else if (!Number.isFinite(hasil)) {
                    layar.value = "Tidak Terhingga";
                } else {
                    layar.value = String(
                        Number(hasil.toPrecision(12))
                    );
                }

                ekspresi = layar.value;

            } catch {
                layar.value = "Error";
                ekspresi = "Error";
            }
        }
    </script>

</body>
</html>
