<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .kalkulator {
            width: 316px;
            padding: 16px;
            border: 2px solid black;
            border-radius: 13px;
        }

        .layar {
            width: 100%;
            height: 64px;
            border: 2px solid black;
            border-radius: 9px;
            margin-bottom: 12px;
            padding: 10px;
            text-align: right;
            font-size: 26px;
            background-color: white;
            color: black;
        }

        .tombol {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 57px;
            border: none;
            border-radius: 9px;
            background-color: #d6d6d6;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .hapus {
            background-color: #e53935;
            color: white;
        }

        .hapus-satu {
            background-color: #ff9800;
            color: white;
        }

        .operator {
            background-color: #555555;
            color: white;
        }

        .hasil {
            background-color: #4682b4;
            color: white;
        }

        .nol {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="kalkulator">
        <input type="text" class="layar" id="layar"
               value="0" readonly>

        <div class="tombol">
            <button class="hapus" onclick="bersihkan()">C</button>
            <button class="hapus-satu" onclick="hapusSatu()">⌫</button>
            <button class="operator" onclick="persen()">%</button>
            <button class="operator" onclick="tambahOperator('/')">÷</button>

            <button onclick="masukkan('7')">7</button>
            <button onclick="masukkan('8')">8</button>
            <button onclick="masukkan('9')">9</button>
            <button class="operator" onclick="tambahOperator('*')">×</button>

            <button onclick="masukkan('4')">4</button>
            <button onclick="masukkan('5')">5</button>
            <button onclick="masukkan('6')">6</button>
            <button class="operator" onclick="tambahOperator('-')">−</button>

            <button onclick="masukkan('1')">1</button>
            <button onclick="masukkan('2')">2</button>
            <button onclick="masukkan('3')">3</button>
            <button class="operator" onclick="tambahOperator('+')">+</button>

            <button class="nol" onclick="masukkan('0')">0</button>
            <button onclick="masukkan('.')">.</button>
            <button class="hasil" onclick="hitung()">=</button>
        </div>
    </div>
    
<script>
    const display = document.getElementById("display");

    function append(value) {
        if (display.value === "Error") {
            display.value = "0";
        }

        if (display.value === "0" && !isNaN(value)) {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1) || "0";
    }

    function calculate() {
        try {
            const expression = display.value;

            if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
                throw new Error("Input tidak valid");
            }

            const result = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if (!Number.isFinite(result)) {
                throw new Error("Hasil tidak valid");
            }

            display.value = String(
                Number(result.toPrecision(12))
            );

        } catch (error) {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
